<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de CSS Customizados</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PrismJS para Highlighting do Código -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <style>
    body { background-color: #0d1117; color: #c9d1d9; }
    .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header / Barra Superior -->
  <header class="glass sticky top-0 z-40 border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-purple-500/20">
        <i class="fa-solid fa-code"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">CSS Vault</h1>
        <p class="text-xs text-gray-400">Estilos e temas customizados de fácil acesso</p>
      </div>
    </div>

    <!-- Campo de Busca -->
    <div class="relative w-full sm:w-72">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
      <input type="text" id="searchInput" placeholder="Buscar CSS..." 
             class="w-full bg-gray-900/80 border border-gray-800 text-sm text-gray-200 rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:border-purple-500 transition">
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
    
    <!-- Filtro de Abas -->
    <div class="flex flex-wrap gap-2 mb-8 border-b border-gray-800 pb-4" id="tabsContainer">
      <button onclick="filterCategory('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-purple-600 text-white shadow-md">
        <i class="fa-solid fa-border-all mr-2"></i>Todos
      </button>
      <button onclick="filterCategory('whatsapp')" id="tab-whatsapp" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition">
        <i class="fa-brands fa-whatsapp text-green-500 mr-2"></i>WhatsApp
      </button>
      <button onclick="filterCategory('github')" id="tab-github" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition">
        <i class="fa-brands fa-github text-white mr-2"></i>GitHub
      </button>
      <button onclick="filterCategory('spotify')" id="tab-spotify" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition">
        <i class="fa-brands fa-spotify text-green-400 mr-2"></i>Spotify
      </button>
      <button onclick="filterCategory('youtube')" id="tab-youtube" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition">
        <i class="fa-brands fa-youtube text-red-500 mr-2"></i>YouTube
      </button>
    </div>

    <!-- Container do Grid de Cards -->
    <div id="cssGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Caso sem resultados -->
    <div id="noResults" class="hidden text-center py-16">
      <i class="fa-solid fa-folder-open text-4xl text-gray-600 mb-3"></i>
      <p class="text-gray-400 font-medium">Nenhum CSS encontrado.</p>
    </div>
  </main>

  <!-- Modal para Visualização de Código -->
  <div id="codeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-3xl rounded-2xl overflow-hidden flex flex-col max-h-[85vh] shadow-2xl border border-gray-700">
      <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-code text-purple-400"></i>
          <h3 id="modalTitle" class="font-semibold text-white">Visualizar Código CSS</h3>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
        <pre class="rounded-xl bg-gray-950 p-4 border border-gray-800 text-sm"><code id="modalCode" class="language-css">Carregando código...</code></pre>
      </div>

      <div class="px-6 py-4 border-t border-gray-800 flex justify-end gap-3 bg-gray-900/50">
        <button onclick="copyModalCode()" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium transition flex items-center gap-2">
          <i class="fa-regular fa-copy"></i> Copiar Código
        </button>
      </div>
    </div>
  </div>

  <script>
    // LISTA DOS SEUS ESTILOS CSS
    // Nota: Se a pasta no seu GitHub for "whatsAPP" com letras maiúsculas, ajuste no campo "file" abaixo.
    const cssItems = [
      {
        title: "Tema WhatsApp Web",
        category: "whatsapp",
        description: "Estilo customizado para a interface do WhatsApp Web.",
        file: "whatsAPP/style.css" 
      },
      {
        title: "Tema GitHub",
        category: "github",
        description: "Estilo customizado para a interface do GitHub.",
        file: "github/style.css"
      },
      {
        title: "Tema Spotify Web",
        category: "spotify",
        description: "Estilo customizado para o player do Spotify Web.",
        file: "spotify/style.css"
      },
      {
        title: "Tema YouTube",
        category: "youtube",
        description: "Estilo customizado para o player e interface do YouTube.",
        file: "youtube/style.css"
      }
    ];

    let currentCategory = 'all';

    // Ícones e cores das marcas
    const platformMeta = {
      whatsapp: { icon: 'fa-brands fa-whatsapp', color: 'text-green-500' },
      github:   { icon: 'fa-brands fa-github',   color: 'text-white' },
      spotify:  { icon: 'fa-brands fa-spotify',  color: 'text-green-400' },
      youtube:  { icon: 'fa-brands fa-youtube',  color: 'text-red-500' }
    };

    // Renderizar os cards na tela
    function renderCards() {
      const grid = document.getElementById('cssGrid');
      const noResults = document.getElementById('noResults');
      const search = document.getElementById('searchInput').value.toLowerCase();

      grid.innerHTML = '';

      const filtered = cssItems.filter(item => {
        const matchCategory = currentCategory === 'all' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');

      filtered.forEach(item => {
        const meta = platformMeta[item.category] || { icon: 'fa-solid fa-file-code', color: 'text-purple-400' };
        
        // Gera o link direto do arquivo CSS no seu domínio da Vercel
        const fullCssUrl = window.location.origin + '/' + item.file;

        const card = document.createElement('div');
        card.className = 'glass rounded-2xl p-5 flex flex-col justify-between hover:border-purple-500/50 transition duration-300 shadow-lg hover:shadow-purple-500/5 group';
        
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-800 border border-gray-700 flex items-center gap-2">
                <i class="${meta.icon} ${meta.color}"></i>
                <span class="capitalize text-gray-300">${item.category}</span>
              </span>
            </div>
            <h3 class="text-lg font-bold text-white group-hover:text-purple-400 transition mb-2">${item.title}</h3>
            <p class="text-xs text-gray-400 leading-relaxed mb-6">${item.description}</p>
          </div>

          <div class="flex items-center gap-2 pt-4 border-t border-gray-800/80">
            <button onclick="openModal('${item.title}', '${item.file}')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs py-2.5 px-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
              <i class="fa-regular fa-eye"></i> Ver Código
            </button>
            <button onclick="copyToClipboard('${fullCssUrl}', this)" class="bg-purple-600/20 hover:bg-purple-600 text-purple-300 hover:text-white border border-purple-500/30 text-xs py-2.5 px-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
              <i class="fa-regular fa-copy"></i> Copiar Link
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filtrar por Abas
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition';
      });

      const activeTab = document.getElementById(`tab-${cat}`);
      if (activeTab) {
        activeTab.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-purple-600 text-white shadow-md';
      }

      renderCards();
    }

    // Evento de Busca
    document.getElementById('searchInput').addEventListener('input', renderCards);

    // Modal de Código
    async function openModal(title, filePath) {
      document.getElementById('modalTitle').innerText = title;
      const codeElem = document.getElementById('modalCode');
      codeElem.textContent = "Carregando...";
      document.getElementById('codeModal').classList.remove('hidden');

      try {
        const res = await fetch('./' + filePath);
        if(!res.ok) throw new Error("Erro ao carregar");
        const code = await res.text();
        codeElem.textContent = code;
        Prism.highlightElement(codeElem);
      } catch (e) {
        codeElem.textContent = "Não foi possível carregar este arquivo CSS. Verifique se o nome da pasta no GitHub está escrito com letras maiúsculas/minúsculas iguais ao caminho do arquivo.";
      }
    }

    function closeModal() {
      document.getElementById('codeModal').classList.add('hidden');
    }

    function copyModalCode() {
      const code = document.getElementById('modalCode').textContent;
      navigator.clipboard.writeText(code);
      alert("Código CSS copiado para a área de transferência!");
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text);
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Copiado!`;
      setTimeout(() => { btn.innerHTML = originalText; }, 2000);
    }

    // Carregar os cards assim que a página abrir
    renderCards();
  </script>
</body>
</html>
