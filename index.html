<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de CSS Customizados</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PrismJS para Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <style>
    /* Tema padrão: Roxo (escuro) */
    body { background-color: #0d1117; color: #c9d1d9; transition: background-color .3s, color .3s; }
    .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); transition: background-color .3s, border-color .3s; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    /* Tema: Preto (monocromático) */
    html[data-theme="preto"] body { background-color: #000000; color: #e5e5e5; }
    html[data-theme="preto"] .glass { background: rgba(10, 10, 10, 0.9); border-color: rgba(255,255,255,0.08); }
    html[data-theme="preto"] .bg-gray-900\/80 { background-color: rgba(15,15,15,0.9) !important; }
    html[data-theme="preto"] .bg-purple-600, html[data-theme="preto"] .from-blue-600.to-purple-600 { background: #1a1a1a !important; }
    html[data-theme="preto"] .text-purple-400, html[data-theme="preto"] .text-purple-300 { color: #d1d1d1 !important; }
    html[data-theme="preto"] .border-purple-500\/30, html[data-theme="preto"] .hover\:border-purple-500 { border-color: #444 !important; }

    /* Tema: Branco (claro) */
    html[data-theme="branco"] body { background-color: #f4f4f6; color: #16181d; }
    html[data-theme="branco"] .glass { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.08); }
    html[data-theme="branco"] .bg-gray-900\/80, html[data-theme="branco"] .bg-gray-800, html[data-theme="branco"] .bg-gray-950 { background-color: #ffffff !important; border-color: rgba(0,0,0,0.1) !important; }
    html[data-theme="branco"] .text-white { color: #16181d !important; }
    html[data-theme="branco"] .text-gray-300, html[data-theme="branco"] .text-gray-400 { color: #4b4f58 !important; }
    html[data-theme="branco"] .border-gray-800, html[data-theme="branco"] .border-gray-700 { border-color: rgba(0,0,0,0.1) !important; }
    html[data-theme="branco"] .hover\:bg-gray-800:hover, html[data-theme="branco"] .hover\:bg-gray-700:hover { background-color: #ececec !important; }
    html[data-theme="branco"] .hover\:text-white:hover { color: #16181d !important; }

    /* Seletor de tema */
    .theme-dot { width: 22px; height: 22px; border-radius: 9999px; cursor: pointer; border: 2px solid transparent; transition: transform .15s, border-color .15s; }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot.active { border-color: #a855f7; }

    /* Cabeçalho dinâmico */
    .dynamic-border { position: relative; }
    .dynamic-border::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899, #3b82f6);
      background-size: 300% 100%; animation: slide 6s linear infinite;
    }
    @keyframes slide { 0% { background-position: 0% 0; } 100% { background-position: 300% 0; } }
    .pulse-dot { width: 8px; height: 8px; border-radius: 9999px; background: #22c55e; box-shadow: 0 0 0 rgba(34,197,94,0.6); animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
  </style>
</head>

        <p class="text-xs text-gray-400">Estilos e temas customizados de fácil acesso</p>
      </div>
    </div>

    <div class="flex items-center gap-3 w-full sm:w-auto">
      <!-- Campo de Busca -->
      <div class="relative flex-1 sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Buscar CSS..." 
               class="w-full bg-gray-900/80 border border-gray-800 text-sm text-gray-200 rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:border-purple-500 transition">
      </div>

      <!-- Seletor de tema -->
      <div class="flex items-center gap-2 bg-gray-900/80 border border-gray-800 rounded-xl px-3 py-2 shrink-0">
        <button onclick="setTheme('roxo')" id="dot-roxo" class="theme-dot active" style="background:#7c3aed" title="Roxo"></button>
        <button onclick="setTheme('preto')" id="dot-preto" class="theme-dot" style="background:#000;border-color:#333" title="Preto"></button>
        <button onclick="setTheme('branco')" id="dot-branco" class="theme-dot" style="background:#fff;border-color:#ccc" title="Branco"></button>
      </div>

      <!-- Link para o GitHub -->
      <a href="https://github.com/script33dt-glitch/CSS-GERAL" target="_blank" rel="noopener noreferrer"
         class="flex items-center gap-2 bg-gray-900/80 border border-gray-800 hover:border-purple-500 text-gray-300 hover:text-white text-sm px-4 py-2 rounded-xl transition shrink-0">
        <i class="fa-brands fa-github"></i>
        <span class="hidden sm:inline">Ver no GitHub</span>
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
    
    <!-- Filtro de Abas (geradas automaticamente a partir dos arquivos do repositório) -->
    <div class="flex flex-wrap gap-2 mb-8 border-b border-gray-800 pb-4" id="tabsContainer">
      <button onclick="filterCategory('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-purple-600 text-white shadow-md">
        <i class="fa-solid fa-border-all mr-2"></i>Todos
      </button>
    </div>

    <!-- Container do Grid de Cards -->
    <div id="cssGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Caso sem resultados -->
    <div id="noResults" class="hidden text-center py-16">
      <i class="fa-solid fa-folder-open text-4xl text-gray-600 mb-3"></i>
      <p class="text-gray-400 font-medium">Nenhum CSS encontrado.</p>
    </div>
  </main>

  <!-- Modal para Visualização de Código -->
  <div id="codeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-3xl rounded-2xl overflow-hidden flex flex-col max-h-[85vh] shadow-2xl border border-gray-700">
      <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-code text-purple-400"></i>
          <h3 id="modalTitle" class="font-semibold text-white">Visualizar Código CSS</h3>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
        <pre class="rounded-xl bg-gray-950 p-4 border border-gray-800 text-sm"><code id="modalCode" class="language-css">Carregando código...</code></pre>
      </div>

      <div class="px-6 py-4 border-t border-gray-800 flex justify-end gap-3 bg-gray-900/50">
        <button onclick="copyModalCode()" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium transition flex items-center gap-2">
          <i class="fa-regular fa-copy"></i> Copiar Código
        </button>
      </div>
    </div>
  </div>

  <!-- Rodapé / Créditos -->
  <footer class="border-t border-gray-800 px-6 py-5 text-center text-xs text-gray-500">
    Feito por <a href="https://github.com/script33dt-glitch" target="_blank" rel="noopener noreferrer" class="text-gray-300 hover:text-purple-400 transition font-medium">script33dt-glitch</a>
    com ajuda do <span class="text-gray-300 font-medium">Claude</span> (Anthropic)
  </footer>

  <script>
    // Dados reais do repositório
    const GITHUB_USER = "script33dt-glitch";
    const GITHUB_REPO = "CSS-GERAL";
    const GITHUB_BRANCH = "main";

    // Lista de estilos: preenchida automaticamente lendo o conteúdo do repositório
    // (nada aqui precisa ser editado à mão — basta subir/atualizar arquivos no GitHub)
    let cssItems = [];
    let currentCategory = 'all';

    // Ícone/cor para categorias conhecidas. Categorias novas (detectadas pelo nome do
    // arquivo) recebem um ícone genérico e uma cor tirada dessa paleta, em sequência.
    const platformMeta = {
      whatsapp: { icon: 'fa-brands fa-whatsapp', color: 'text-green-500', label: 'WhatsApp' },
      github:   { icon: 'fa-brands fa-github',   color: 'text-white',     label: 'GitHub' },
      spotify:  { icon: 'fa-brands fa-spotify',  color: 'text-green-400', label: 'Spotify' },
      youtube:  { icon: 'fa-brands fa-youtube',  color: 'text-red-500',   label: 'YouTube' }
    };
    const fallbackColors = ['text-blue-400', 'text-pink-400', 'text-yellow-400', 'text-orange-400', 'text-cyan-400', 'text-indigo-400'];
    let fallbackColorIndex = 0;

    function metaFor(category) {
      if (platformMeta[category]) return platformMeta[category];
      // Categoria nova: cria e memoriza um estilo pra ela na hora
      const meta = {
        icon: 'fa-solid fa-file-code',
        color: fallbackColors[fallbackColorIndex % fallbackColors.length],
        label: category.charAt(0).toUpperCase() + category.slice(1)
      };
      fallbackColorIndex++;
      platformMeta[category] = meta;
      return meta;
    }

    // Descobre a categoria pelo nome do arquivo. Se nenhuma palavra-chave bater,
    // cai em "outros".
    function detectCategory(filename) {
      const lower = filename.toLowerCase();
      const known = ['whatsapp', 'github', 'spotify', 'youtube', 'instagram', 'twitter', 'discord', 'telegram', 'netflix'];
      for (const key of known) {
        if (lower.includes(key)) return key;
      }
      return 'outros';
    }

    // Monta um título legível a partir do nome do arquivo
    function titleFor(filename, category) {
      let cleaned = filename.replace(/\.css$/i, '').replace(/^style\.css\s*/i, '').replace(/^style[\s._-]*/i, '').trim();
      if (!cleaned || cleaned.toLowerCase() === category) {
        cleaned = metaFor(category).label;
      }
      return 'Tema ' + cleaned;
    }

    // Monta a URL raw codificando cada segmento do path (necessário por causa de espaços nos nomes)
    function buildRawUrl(path) {
      const encodedPath = path.split('/').map(encodeURIComponent).join('/');
      return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodedPath}`;
    }

    // Busca a lista de arquivos .css direto do repositório via API do GitHub.
    // Isso roda toda vez que a página carrega, então: arquivo novo = card novo
    // automaticamente; arquivo com o mesmo nome editado = conteúdo atualizado
    // automaticamente (o "Ver Código" sempre busca o conteúdo mais recente).
    async function loadCssItemsFromGithub() {
      const grid = document.getElementById('cssGrid');
      grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i><p>Carregando estilos do repositório...</p></div>`;

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Falha ao listar repositório (status ' + res.status + ')');
        const files = await res.json();

        cssItems = files
          .filter(f => f.type === 'file' && /\.css/i.test(f.name))
          .map(f => {
            const category = detectCategory(f.name);
            return {
              title: titleFor(f.name, category),
              category: category,
              description: `Estilo customizado (${f.name}).`,
              path: f.name
            };
          });

        renderTabs();
        renderCards();
      } catch (e) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400">
          <i class="fa-solid fa-triangle-exclamation text-2xl mb-3 text-yellow-500"></i>
          <p>Não foi possível carregar a lista do repositório agora.</p>
          <p class="text-xs mt-2">Isso pode acontecer se o limite de requisições da API do GitHub for atingido. Tente recarregar a página em alguns minutos.</p>
        </div>`;
      }
    }

    // Gera as abas de categoria a partir do que foi encontrado nos arquivos
    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      const categories = [...new Set(cssItems.map(i => i.category))];

      // Remove abas antigas (menos "Todos") antes de recriar
      container.querySelectorAll('.tab-btn:not(#tab-all)').forEach(btn => btn.remove());

      categories.forEach(cat => {
        const meta = metaFor(cat);
        const btn = document.createElement('button');
        btn.id = `tab-${cat}`;
        btn.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition';
        btn.onclick = () => filterCategory(cat);
        btn.innerHTML = `<i class="${meta.icon} ${meta.color} mr-2"></i>${meta.label}`;
        container.appendChild(btn);
      });
    }

    function renderCards() {
      const grid = document.getElementById('cssGrid');
      const noResults = document.getElementById('noResults');
      const search = document.getElementById('searchInput').value.toLowerCase();

      document.getElementById('itemCount').textContent = cssItems.length;
      grid.innerHTML = '';

      const filtered = cssItems.filter(item => {
        const matchCategory = currentCategory === 'all' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');

      filtered.forEach(item => {
        const meta = metaFor(item.category);
        const rawGithubUrl = buildRawUrl(item.path);

        const card = document.createElement('div');
        card.className = 'glass rounded-2xl p-5 flex flex-col justify-between hover:border-purple-500/50 transition duration-300 shadow-lg hover:shadow-purple-500/5 group';
        
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-800 border border-gray-700 flex items-center gap-2">
                <i class="${meta.icon} ${meta.color}"></i>
                <span class="text-gray-300">${meta.label}</span>
              </span>
            </div>
            <h3 class="text-lg font-bold text-white group-hover:text-purple-400 transition mb-2">${item.title}</h3>
            <p class="text-xs text-gray-400 leading-relaxed mb-6">${item.description}</p>
          </div>

          <div class="flex items-center gap-2 pt-4 border-t border-gray-800/80">
            <button onclick="openModal('${item.title}', '${rawGithubUrl}')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs py-2.5 px-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
              <i class="fa-regular fa-eye"></i> Ver Código
            </button>
            <button onclick="copyToClipboard('${rawGithubUrl}', this)" class="bg-purple-600/20 hover:bg-purple-600 text-purple-300 hover:text-white border border-purple-500/30 text-xs py-2.5 px-3 rounded-xl font-medium transition flex items-center justify-center gap-2">
              <i class="fa-regular fa-copy"></i> Copiar Link
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition';
      });

      const activeTab = document.getElementById(`tab-${cat}`);
      if (activeTab) {
        activeTab.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium transition bg-purple-600 text-white shadow-md';
      }

      renderCards();
    }

    document.getElementById('searchInput').addEventListener('input', renderCards);

    async function openModal(title, url) {
      document.getElementById('modalTitle').innerText = title;
      const codeElem = document.getElementById('modalCode');
      codeElem.textContent = "Carregando código...";
      document.getElementById('codeModal').classList.remove('hidden');

      try {
        const res = await fetch(url);
        if(!res.ok) throw new Error("Falha ao buscar");
        const code = await res.text();
        codeElem.textContent = code;
        Prism.highlightElement(codeElem);
      } catch (e) {
        codeElem.textContent = "Não foi possível carregar o arquivo CSS.\n\nVerifique se o repositório continua público e se o nome do arquivo não mudou.";
      }
    }

    function closeModal() {
      document.getElementById('codeModal').classList.add('hidden');
    }

    function copyModalCode() {
      const code = document.getElementById('modalCode').textContent;
      navigator.clipboard.writeText(code);
      alert("Código CSS copiado!");
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text);
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Copiado!`;
      setTimeout(() => { btn.innerHTML = originalText; }, 2000);
    }

    // Troca de tema (Roxo / Preto / Branco)
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      document.getElementById(`dot-${theme}`).classList.add('active');
      try { localStorage.setItem('cssVaultTheme', theme); } catch (e) {}
    }

    function loadTheme() {
      let saved = 'roxo';
      try { saved = localStorage.getItem('cssVaultTheme') || 'roxo'; } catch (e) {}
      setTheme(saved);
    }

    loadTheme();
    loadCssItemsFromGithub();
  </script>
</body>
</html>
